# Deploy Astro site to GitHub Pages
#
# Triggers:
#   - Push to main (production deploy)
#   - Manual dispatch (on-demand rebuild)
#   - Daily schedule (reveals drip-fed posts on their publish date without a push)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily — surfaces notes whose frontmatter `date` has passed
    - cron: '0 6 * * *'

# Allow only one concurrent deployment, skip queued runs (only latest matters)
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Remove variation/test pages
        run: rm -rf src/pages/variations

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
